networks:
  web:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  crowdtimer_pb_data:
  crowdtimer_cclog_data:
  crowdtimer_site_dist:
  botini_pgdata:
  botini_media:
  umami_pgdata:
  network_pgdata:
  # Kept so the disabled Twenty CRM data isn't orphaned/GC'd; not referenced
  # by any active service while twenty-* is commented out above.
  twenty_pgdata:
  twenty_server_data:

secrets:
  crowdtimer_cloudflared_token:
    file: ${CROWDTIMER_TUNNEL_TOKEN_FILE:?set in CrowdTimer production env}
