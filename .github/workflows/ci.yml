name: CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: "Deploy the validated, pinned revisions to production"
        required: true
        type: boolean
        default: false

jobs:
  validate:
    name: Validate Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose (Production)
        run: |
          docker compose \
            --env-file .env.example \
            --env-file deploy/versions.env \
            --env-file .env.crowdtimer.example \
            -f docker-compose.yml config > /dev/null
          echo "✓ Production Docker Compose syntax is valid"

      - name: Validate Docker Compose (Local)
        run: |
          docker compose -f docker-compose.local.yml config > /dev/null
          echo "✓ Local Docker Compose is valid"

      - name: Validate Caddyfile (Production)
        run: |
          docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile" \
            caddy:2.11-alpine caddy validate --config /etc/caddy/Caddyfile
          echo "✓ Production Caddyfile checked"

      - name: Validate Caddyfile (Local)
        run: |
          docker run --rm -v "$PWD/Caddyfile.local:/etc/caddy/Caddyfile" \
            caddy:2.11-alpine caddy validate --config /etc/caddy/Caddyfile
          echo "✓ Local Caddyfile checked"

      - name: Run infrastructure tests
        run: |
          ./scripts/test.sh

      - name: Validate Ansible playbook syntax
        run: |
          pip install ansible
          ansible-playbook -i ansible/inventory.ini ansible/playbook.yml --syntax-check
          echo "✓ Ansible playbook syntax checked"

  build-test:
    name: Build Verification (Available Services)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Build tempi-app (if Tempi.app exists)
        run: |
          if [ -d "../Tempi.app" ]; then
            echo "Building tempi-app..."
            docker build -t tempi-app-test -f packages/tempi/Dockerfile ..
            echo "✓ tempi-app build attempted"
          else
            echo "⚠️  Tempi.app repository not found (expected in CI)"
            echo "✓ Skipping tempi-app build"
          fi

      - name: Test Caddy image pull
        run: |
          docker pull caddy:2.11-alpine
          echo "✓ Caddy image available"

      - name: Test PostgreSQL image pull
        run: |
          docker pull postgres:18-alpine
          echo "✓ PostgreSQL 18 image available"

      - name: Test Redis image pull
        run: |
          docker pull redis:8-alpine
          echo "✓ Redis 8 image available"

      - name: Test Bun image pull
        run: |
          docker pull oven/bun:1.3-alpine
          echo "✓ Bun image available"

      - name: Test cloudflared image pull
        run: |
          docker pull cloudflare/cloudflared:2026.9.1
          echo "✓ cloudflared image available"

      - name: Summary
        run: |
          echo "================================"
          echo "CI Summary:"
          echo "================================"
          echo "✓ Configuration validated"
          echo "✓ Base images verified"
          echo "⚠️  Private repo builds skipped (expected in CI)"
          echo ""
          echo "Note: backin15, fichus, and botini.club are private repos"
          echo "      and will be built in production deployment"

  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    needs: build-test
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy_production &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    environment: production
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config << EOF
          Host vps
            HostName ${{ secrets.VPS_HOST }}
            User ${{ secrets.VPS_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Stage CrowdTimer production secrets
        env:
          CROWDTIMER_ENV_CONTENT: ${{ secrets.CROWDTIMER_ENV }}
          CROWDTIMER_TUNNEL_TOKEN: ${{ secrets.CROWDTIMER_TUNNEL_TOKEN }}
        run: |
          test -n "$CROWDTIMER_ENV_CONTENT"
          test -n "$CROWDTIMER_TUNNEL_TOKEN"
          umask 077
          printf '%s\n' "$CROWDTIMER_ENV_CONTENT" > /tmp/crowdtimer.env
          printf '%s' "$CROWDTIMER_TUNNEL_TOKEN" > /tmp/crowdtimer-tunnel-token
          ssh vps 'install -d -m 700 ~/.config/cyment-infra'
          scp /tmp/crowdtimer.env vps:.config/cyment-infra/crowdtimer.env.next
          scp /tmp/crowdtimer-tunnel-token vps:.config/cyment-infra/crowdtimer-tunnel-token.next
          ssh vps 'chmod 600 ~/.config/cyment-infra/*.next && mv ~/.config/cyment-infra/crowdtimer.env.next ~/.config/cyment-infra/crowdtimer.env && mv ~/.config/cyment-infra/crowdtimer-tunnel-token.next ~/.config/cyment-infra/crowdtimer-tunnel-token'

      - name: Deploy to VPS
        run: |
          echo "🚀 Deploying to production VPS..."
          ssh vps 'bash -se' <<'REMOTE'
          cd "${{ secrets.VPS_PATH }}"
          BACKIN15_BRANCH=master
          TEMPI_BRANCH=master
          FICHUS_BRANCH=main
          BOTINI_BRANCH=main
          XCSTEWARD_BRANCH=main
          BACKIN15_REPO=git@github.com:acyment/backin15.git
          TEMPI_REPO=git@github.com:acyment/Tempi.app.git
          FICHUS_REPO=git@github.com:acyment/fichus.git
          BOTINI_REPO=git@github.com:acyment/botini.club.git
          XCSTEWARD_REPO=https://github.com/acyment/XCSteward-website.git
          CROWDTIMER_REPO=git@github.com:acyment/CrowdTimer.git

          ensure_repo() {
            local path="$1"
            local repo_url="$2"
            local branch="$3"
            local label="$4"
            local required="${5:-true}"

            if [ ! -d "$path/.git" ]; then
              if [ -e "$path" ]; then
                mv "$path" "${path}.pre-git.$(date +%Y%m%d%H%M%S)"
              fi
              if ! git clone "$repo_url" "$path"; then
                if [ "$required" = "true" ]; then
                  echo "$label clone failed"
                  exit 1
                fi
                echo "$label clone failed"
                return
              fi
            fi

            if ! git -C "$path" fetch "$repo_url" "$branch"; then
              if [ "$required" = "true" ]; then
                echo "$label pull failed"
                exit 1
              fi
              echo "$label pull failed"
              return
            fi

            if git -C "$path" show-ref --verify --quiet "refs/heads/$branch"; then
              if ! git -C "$path" checkout "$branch"; then
                if [ "$required" = "true" ]; then
                  echo "$label pull failed"
                  exit 1
                fi
                echo "$label pull failed"
                return
              fi
            else
              if ! git -C "$path" checkout -B "$branch" FETCH_HEAD; then
                if [ "$required" = "true" ]; then
                  echo "$label pull failed"
                  exit 1
                fi
                echo "$label pull failed"
                return
              fi
            fi

            if ! git -C "$path" merge --ff-only FETCH_HEAD; then
              if [ "$required" = "true" ]; then
                echo "$label pull failed"
                exit 1
              fi
              echo "$label pull failed"
            fi
          }

          ensure_repo_ref() {
            local path="$1"
            local repo_url="$2"
            local ref="$3"
            local label="$4"
            local actual_ref

            if [ ! -d "$path/.git" ]; then
              if [ -e "$path" ]; then
                mv "$path" "${path}.pre-git.$(date +%Y%m%d%H%M%S)"
              fi
              git clone "$repo_url" "$path"
            fi

            git -C "$path" fetch "$repo_url" "$ref"
            git -C "$path" checkout --detach FETCH_HEAD
            actual_ref=$(git -C "$path" rev-parse HEAD)
            if [ "$actual_ref" != "$ref" ]; then
              echo "$label checkout mismatch: expected $ref, got $actual_ref"
              exit 1
            fi
          }
          echo 'Pulling latest changes...'
          git pull --ff-only origin "${{ github.ref_name }}"
          source deploy/versions.env

          echo 'Pulling sibling repos...'
          ensure_repo ../backin15 "$BACKIN15_REPO" "$BACKIN15_BRANCH" backin15
          ensure_repo ../Tempi.app "$TEMPI_REPO" "$TEMPI_BRANCH" Tempi.app false
          ensure_repo ../fichus "$FICHUS_REPO" "$FICHUS_BRANCH" fichus
          ensure_repo ../botini.club "$BOTINI_REPO" "$BOTINI_BRANCH" botini.club
          ensure_repo ../XCSteward-website "$XCSTEWARD_REPO" "$XCSTEWARD_BRANCH" XCSteward-website
          ensure_repo_ref ../CrowdTimer "$CROWDTIMER_REPO" "$CROWDTIMER_REF" CrowdTimer

          echo 'Running deployment script...'
          CROWDTIMER_ENV_FILE="$HOME/.config/cyment-infra/crowdtimer.env" ./scripts/deploy.sh production
          REMOTE

      - name: Verify deployment
        run: |
          echo "✅ Deployment complete!"
          echo ""
          echo "Services:"
          echo "  - BackIn15: https://backin15.app"
          echo "  - Fichus Feria: https://feria.fichusapp.com/healthz"
          echo "  - CrowdTimer: https://live.crowdtimer.app"
          ssh vps "cd ${{ secrets.VPS_PATH }} && docker compose --env-file .env --env-file deploy/versions.env --env-file ~/.config/cyment-infra/crowdtimer.env ps"
